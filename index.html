<!-- index.html - Estructura principal -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Sala - Cine y Series</title>
    <style>
        /* Estilos base modernos */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0a0a0a; 
            color: #fff;
        }
        
        /* Header estilo streaming */
        .header {
            background: linear-gradient(180deg, #1a1a1a 0%, transparent 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
        }
        
        .search-bar {
            display: flex;
            gap: 10px;
        }
        
        .search-bar input {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            width: 300px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
        }
        
        .search-bar input::placeholder {
            color: #999;
        }
        
        /* Grid de películas */
        .main-content {
            padding-top: 100px;
            padding-left: 40px;
            padding-right: 40px;
        }
        
        .categoria-titulo {
            font-size: 24px;
            margin: 30px 0 20px 0;
            color: #fff;
        }
        
        .peliculas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .pelicula-card {
            cursor: pointer;
            transition: transform 0.3s ease;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .pelicula-card:hover {
            transform: scale(1.05);
        }
        
        .pelicula-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .pelicula-card .info {
            padding: 10px 0;
        }
        
        .pelicula-card .titulo {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .pelicula-card .año {
            color: #999;
            font-size: 14px;
        }
        
        .pelicula-card .calidad {
            background: #e50914;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
        
        /* Modal del reproductor */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }
        
        .modal.active {
            display: block;
        }
        
        .modal-content {
            position: relative;
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .modal-close {
            position: absolute;
            right: 20px;
            top: 20px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            z-index: 10;
            background: none;
            border: none;
        }
        
        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
        }
        
        .player-wrapper iframe,
        .player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .modal-info {
            padding: 30px;
        }
        
        .modal-info h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .modal-info .meta {
            color: #999;
            margin-bottom: 15px;
        }
        
        .modal-info .sinopsis {
            line-height: 1.6;
            color: #ddd;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .search-bar input {
                width: 100%;
            }
            
            .peliculas-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .modal-content {
                width: 95%;
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="#" class="logo">🎬 La Sala</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar películas, series...">
            <button onclick="buscarContenido()" style="padding: 10px 20px; border-radius: 25px; border: none; background: #e50914; color: #fff; cursor: pointer;">Buscar</button>
        </div>
        <div>
            <button onclick="cambiarTema()" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">🌙</button>
        </div>
    </header>
    
    <!-- Contenido Principal -->
    <main class="main-content">
        <h2 class="categoria-titulo">🔥 Películas Destacadas</h2>
        <div class="peliculas-grid" id="peliculasGrid">
            <!-- Se genera con JavaScript -->
        </div>
        
        <h2 class="categoria-titulo">📺 Series Populares</h2>
        <div class="peliculas-grid" id="seriesGrid">
            <!-- Se genera con JavaScript -->
        </div>
    </main>
    
    <!-- Modal del Reproductor -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="modal-close" onclick="cerrarReproductor()">✕</button>
            <div class="player-wrapper" id="player-container">
                <!-- El reproductor se inyecta aquí -->
            </div>
            <div class="modal-info">
                <h2 id="info-titulo">Título</h2>
                <div class="meta">
                    <span id="info-año">2024</span> • 
                    <span id="info-generos">Drama</span> • 
                    <span id="info-calidad">HD</span>
                </div>
                <p class="sinopsis" id="info-sinopsis">Sinopsis...</p>
            </div>
        </div>
    </div>
    
    <script src="catalogo.js"></script>
    <script src="reproductor.js"></script>
    <script src="app.js"></script>
</body>
</html>
